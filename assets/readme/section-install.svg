<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="120" viewBox="0 0 1200 120"
     role="img" aria-labelledby="ititle idesc">
  <title id="ititle">开始使用</title>
  <desc id="idesc">章节分隔条：开始使用，包含「前提」与「安装」两节。</desc>
  <rect width="1200" height="120" rx="16" fill="#0d0d12"/>
  <rect x="64" y="44" width="4" height="32" rx="2" fill="#f62c55"/>
  <text x="84" y="71"
        font-family="Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif"
        font-size="34" font-weight="700" fill="#ffffff" letter-spacing="-0.5">
    开始使用
  </text>
  <text x="244" y="71"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif"
