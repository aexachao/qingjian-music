<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">轻简音乐 — 为飞牛 fnOS 打造的精致移动端音乐播放器</title>
  <desc id="desc">项目 hero：左侧为名称与价值主张，右侧为 App 图标（绯红圆角方块上的白色音频波形条）。</desc>

  <defs>
    <!-- 背景微渐变 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d12"/>
      <stop offset="100%" stop-color="#14141c"/>
    </linearGradient>
    <!-- 绯红辉光 -->
    <radialGradient id="crimsonGlow" cx="0.8" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#f62c55" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f62c55" stop-opacity="0"/>
    </radialGradient>
    <!-- 图标背后的柔光 -->
    <radialGradient id="iconGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f62c55" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#f62c55" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#f62c55" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="360" rx="26" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="26" fill="url(#crimsonGlow)"/>

  <!-- 左侧：文字信息区 -->
  <g id="title-block" transform="translate(64 78)">
    <!-- 类别标签 -->
    <rect x="0" y="0" width="186" height="32" rx="8" fill="#f62c55" fill-opacity="0.12"/>
    <text x="93" y="22" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif"
          font-size="15" font-weight="600" fill="#f62c55" letter-spacing="0.5">
      私有云音乐客户端
    </text>

    <!-- 项目名称 -->
    <text x="0" y="92"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif"
          font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">
      轻简音乐
    </text>

    <!-- 英文名称 -->
    <text x="4" y="132"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" font-weight="500" fill="#6b6b7b" letter-spacing="1">
      qingjian-music
    </text>

    <!-- 描述 -->
    <text x="0" y="182"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif"
          font-size="22" font-weight="400" fill="#a0a0b0" letter-spacing="0.3">
      为飞牛 fnOS 打造的精致移动端音乐播放器
    </text>

    <!-- 平台标签 -->
    <g transform="translate(0 218)">
      <rect x="0" y="0" width="52" height="28" rx="6" fill="#1e1e28"/>
      <text x="26" y="19" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="13" font-weight="600" fill="#8a8a9a">iOS</text>

      <rect x="62" y="0" width="74" height="28" rx="6" fill="#1e1e28"/>
      <text x="99" y="19" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="13" font-weight="600" fill="#8a8a9a">Android</text>

      <rect x="146" y="0" width="118" height="28" rx="6" fill="#1e1e28"/>
      <text x="205" y="19" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="13" font-weight="600" fill="#8a8a9a">React Native</text>
    </g>
  </g>

  <!-- 右侧：App 图标（按 app 实际图标矢量重绘，非位图） -->
  <circle cx="970" cy="180" r="190" fill="url(#iconGlow)"/>
  <g id="app-icon" transform="translate(850 60) scale(0.234375)">
    <rect width="1024" height="1024" rx="207.4" fill="#f62c55"/>
    <g fill="#ffffff">
      <rect x="224.4" y="619.8" width="20" height="78.4" rx="10"/>
      <rect x="261.5" y="575.7" width="20" height="168.2" rx="10"/>
      <rect x="300.7" y="536.5" width="20" height="244.2" rx="10"/>
      <rect x="340.3" y="507.1" width="20" height="299.7" rx="10"/>
      <rect x="379.9" y="488.3" width="20" height="337.3" rx="10"/>
      <rect x="419.9" y="502.2" width="20" height="303.8" rx="10"/>
      <rect x="459.1" y="525.9" width="20" height="254.8" rx="10"/>
      <rect x="498.3" y="569.2" width="20" height="165.8" rx="10"/>
      <rect x="533.0" y="280.9" width="20" height="383.8" rx="10"/>
      <rect x="572.6" y="231.9" width="20" height="207.4" rx="10"/>
      <rect x="612.6" y="191.9" width="20" height="282.5" rx="10"/>
      <rect x="652.7" y="231.9" width="20" height="271.1" rx="10"/>
      <rect x="692.7" y="273.6" width="20" height="262.9" rx="10"/>
      <rect x="732.3" y="316.0" width="20" height="251.5" rx="10"/>
      <rect x="772.3" y="362.6" width="20" height="205.0" rx="10"/>
    </g>
  </g>

  <!-- 底部细线分隔 -->
  <line x1="64" y1="316" x2="1136" y2="316" stroke="#2a2a3a" stroke-width="1"/>
  <text x="64" y="342"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="14" font-weight="500" fill="#5a5a6a">
    Expo SDK 57 · React Native 0.86 · TypeScript · GPL-3.0
  </text>
</svg>
