<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">轻简音乐 — 为飞牛 fnOS 打造的精致移动端音乐播放器</title>
  <desc id="desc">项目 hero：左侧展示名称与价值主张，右侧以绯红色音频波形条和音符图案呈现音乐播放意象。</desc>

  <defs>
    <!-- 背景微渐变 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d12"/>
      <stop offset="100%" stop-color="#14141c"/>
    </linearGradient>
    <!-- 绯红辉光 -->
    <radialGradient id="crimsonGlow" cx="0.8" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#f62c55" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f62c55" stop-opacity="0"/>
    </radialGradient>
    <!-- 波形条渐变 -->
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f62c55"/>
      <stop offset="100%" stop-color="#ff6b8a"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="360" rx="26" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="26" fill="url(#crimsonGlow)"/>

  <!-- 左侧：文字信息区 -->
  <g id="title-block" transform="translate(64 78)">
    <!-- 类别标签 -->
    <rect x="0" y="0" width="186" height="32" rx="8" fill="#f62c55" fill-opacity="0.12"/>
    <text x="93" y="22" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif"
          font-size="15" font-weight="600" fill="#f62c55" letter-spacing="0.5">
      私有云音乐客户端
    </text>

    <!-- 项目名称 -->
    <text x="0" y="92"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif"
          font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">
      轻简音乐
    </text>

    <!-- 英文名称 -->
    <text x="4" y="132"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" font-weight="500" fill="#6b6b7b" letter-spacing="1">
      qingjian-music
    </text>

    <!-- 描述 -->
    <text x="0" y="182"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif"
          font-size="22" font-weight="400" fill="#a0a0b0" letter-spacing="0.3">
      为飞牛 fnOS 打造的精致移动端音乐播放器
    </text>

    <!-- 平台标签 -->
    <g transform="translate(0 218)">
      <rect x="0" y="0" width="52" height="28" rx="6" fill="#1e1e28"/>
      <text x="26" y="19" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="13" font-weight="600" fill="#8a8a9a">iOS</text>

      <rect x="62" y="0" width="74" height="28" rx="6" fill="#1e1e28"/>
      <text x="99" y="19" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="13" font-weight="600" fill="#8a8a9a">Android</text>

      <rect x="146" y="0" width="118" height="28" rx="6" fill="#1e1e28"/>
      <text x="205" y="19" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="13" font-weight="600" fill="#8a8a9a">React Native</text>
    </g>
  </g>

  <!-- 右侧：视觉证明区（手机轮廓 + 波形） -->
  <g id="project-proof" transform="translate(720 48)">
    <!-- 手机外框 -->
    <rect x="0" y="0" width="200" height="264" rx="28" fill="#181824" stroke="#2a2a3a" stroke-width="2"/>
    <!-- 屏幕 -->
    <rect x="12" y="12" width="176" height="240" rx="20" fill="#0d0d12"/>

    <!-- 波形条（模拟音频可视化） -->
    <g transform="translate(88 96)">
      <rect x="-56" y="24" width="10" height="40" rx="5" fill="url(#barGrad)"/>
      <rect x="-40" y="8" width="10" height="72" rx="5" fill="url(#barGrad)"/>
      <rect x="-24" y="20" width="10" height="48" rx="5" fill="url(#barGrad)"/>
      <rect x="-8"  y="0"  width="10" height="88" rx="5" fill="url(#barGrad)"/>
      <rect x="8"   y="16" width="10" height="56" rx="5" fill="url(#barGrad)"/>
      <rect x="24"  y="28" width="10" height="32" rx="5" fill="url(#barGrad)"/>
      <rect x="40"  y="12" width="10" height="64" rx="5" fill="url(#barGrad)"/>
      <rect x="56"  y="22" width="10" height="44" rx="5" fill="url(#barGrad)"/>
    </g>

    <!-- 播放按钮 -->
    <circle cx="100" cy="180" r="22" fill="#f62c55" fill-opacity="0.15" stroke="#f62c55" stroke-width="2"/>
    <polygon points="94,172 94,188 110,180" fill="#f62c55"/>

    <!-- 小音符装饰 -->
    <g transform="translate(24 40)" opacity="0.25">
      <ellipse cx="6" cy="14" rx="5" ry="4" fill="#f62c55"/>
      <rect x="10" y="2" width="2" height="14" rx="1" fill="#f62c55"/>
      <rect x="10" y="2" width="8" height="2" rx="1" fill="#f62c55"/>
    </g>
    <g transform="translate(156 200)" opacity="0.2">
      <ellipse cx="6" cy="14" rx="5" ry="4" fill="#f62c55"/>
      <rect x="10" y="2" width="2" height="14" rx="1" fill="#f62c55"/>
      <rect x="10" y="2" width="8" height="2" rx="1" fill="#f62c55"/>
    </g>
  </g>

  <!-- 底部细线分隔 -->
  <line x1="64" y1="316" x2="1136" y2="316" stroke="#2a2a3a" stroke-width="1"/>
  <text x="64" y="342"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="14" font-weight="500" fill="#5a5a6a">
    Expo SDK 57 · React Native 0.86 · TypeScript · GPL-3.0
  </text>
</svg>