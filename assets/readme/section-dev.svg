  </text>
  <!-- 右侧代码装饰 -->
  <g transform="translate(1050 43)" opacity="0.2">
    <rect x="0"  y="0"  width="16" height="4" rx="2" fill="#f62c55"/>
    <rect x="20" y="0"  width="28" height="4" rx="2" fill="#f62c55"/>
    <rect x="0"  y="10" width="24" height="4" rx="2" fill="#f62c55"/>
    <rect x="28" y="10" width="20" height="4" rx="2" fill="#f62c55"/>
    <rect x="0"  y="20" width="12" height="4" rx="2" fill="#f62c55"/>
    <rect x="16" y="20" width="32" height="4" rx="2" fill="#f62c55"/>
    <rect x="0"  y="30" width="20" height="4" rx="2" fill="#f62c55"/>
    <rect x="24" y="30" width="24" height="4" rx="2" fill="#f62c55"/>
  </g>
</svg>
