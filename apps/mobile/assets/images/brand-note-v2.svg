    轻简音乐 (Qingjian Music) - 品牌单八分音符矢量路径 (Brand Quaver Note)
    画布尺寸 (viewBox): 0 0 1024 1024
    图形尺寸: 宽 514px, 高 670px, 水平光学居中 (X: 282~796, Y: 173~843)
    
    关键特征与微调锚点 (Key Anatomy & Fine-tuning Anchors):
      1. [510, 215] -> [536, 173]: 左竖杆顶端向上收圆至顶部顶点 (Top Crown)
      2. [536, 173] -> [796, 412]: 尾翼上弧线向右下方优雅延展至最右侧极值点 (Flag Upper Sweep)
      3. [796, 412] -> [752, 537]: 尾翼外侧向下尖端收敛至最低尖角 (Flag Tip Apex)
      4. [752, 537] -> [759, 462]: 尾翼尖角内钩回弹 (Inner Hook Return)
      5. [759, 462] -> [572, 356]: 尾翼内弦月弯弧平滑汇入右竖杆 (Flag Inner Sweep)
      6. [572, 356] -> [572, 710]: 右竖杆笔直垂直向下 (Vertical Right Stem, 宽 62px)
      7. [572, 710] -> [422, 843]: 符头右侧切线过渡至底部极值点 (Bulb Lower-Right Arc, C1 平滑相切)
      8. [422, 843] -> [282, 741]: 符头左侧平滑向上弯曲至最左极值点 (Bulb Lower-Left Arc, C1 平滑相切)
      9. [282, 741] -> [361, 609]: 符头左上圆弧 (Bulb Upper-Left Arc)
     10. [361, 609] -> [510, 575]: 符头平滑汇入左竖杆接点 (Bulb-to-Stem Junction)
     11. [510, 575] -> [510, 215]: 左竖杆笔直垂直向上回到起点 (Vertical Left Stem)
  -->
