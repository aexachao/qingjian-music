name: Build

# 在 GitHub 上构建可分发的安装包，本机不需要装 JDK / Android SDK / Xcode。
#
# 触发方式：
#   · 手动：Actions → Build → Run workflow
#   · 打 tag：git tag v0.1.0 && git push origin v0.1.0（产物会自动挂到 GitHub Release）
#
# 产物：
#   · android-apk        —— **可直装**的 release APK（JS 已内嵌，装到手机上不需要 Metro）
#   · ios-unsigned-ipa   —— **未签名**的 iOS 设备版 IPA，供用户用 Apple ID 自签
#                           （Sideloadly / AltStore / ESign 等），无需付费开发者账号
#
# 为什么 Android 用 release 而不是 debug：debug 包在 RN 下默认**不打包 JS**，
# 装到手机上会连 Metro 才跑得起来，等于没法分发给别人。release 包会内嵌 bundle，
# 且工程的 release 构建类型本来就指向 debug keystore（Expo 模板默认），
# 所以既不需要任何 secret，又可以直接安装。
#
# 为什么 iOS 要显式关签名：真机 IPA 如果走正常签名，需要证书 + 描述文件 + 付费账号。
# 用 CODE_SIGNING_ALLOWED=NO 编出来的 .app 不带签名、不带描述文件，
# 用户拿到后用**自己的** Apple ID 自签即可 —— 这条路完全不需要我们持有凭据，
# 因此 CI 里一个 Secrets 都不用配。
#
# 本地构建（含上架 App Store 的商店版）见 docs/build-and-ci.md。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # 与本机一致的 Node 大版本（package.json engines: >=22）
  NODE_VERSION: '22'

  # ── 发行版（见 apps/mobile/src/lib/edition-policy.ts）───────────────────────
  # GitHub 上分发的构建一律是 `community`：**完整功能、不含任何购买链路**。
  #
  # 刻意放在顶层 env：Android 与 iOS 两个 job 都自动继承，不可能只给一个平台
  # 设了、另一个漏掉。要改发行版只改这一行。
  #
  # 商店版（含永久会员购买、上架 App Store）不走这个工作流，在本地 Xcode 归档时
  # 显式 `EXPO_PUBLIC_EDITION=store`，详见 docs/build-and-ci.md。
  EXPO_PUBLIC_EDITION: community

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. 先把校验跑绿，坏提交不给出包
  # ───────────────────────────────────────────────────────────────────────────
  verify:
    name: 校验（守卫 / ESLint / 类型 / 单测）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 架构守卫
        run: pnpm guard

      - name: ESLint
        run: pnpm lint

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

  # ───────────────────────────────────────────────────────────────────────────
  # 2. JS 打包检查（快，先失败先反馈）
  # ───────────────────────────────────────────────────────────────────────────
  bundle:
    name: JS 打包检查
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 不需要原生工程，纯 Metro 打包。这一步能抓到「模块解析不到 / 平台后缀缺失」
      # 这类问题，比等 20 分钟原生构建失败划算得多。
      - name: 打包 iOS bundle
        working-directory: apps/mobile
        run: pnpm exec expo export --platform ios --output-dir "$RUNNER_TEMP/export-ios"

      - name: 打包 Android bundle
        working-directory: apps/mobile
        run: pnpm exec expo export --platform android --output-dir "$RUNNER_TEMP/export-android"

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Android 可直装 APK
  # ───────────────────────────────────────────────────────────────────────────
  android:
    name: Android APK（可直装）
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # RN 0.86 / Expo 57 用 JDK 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 保证 sdkmanager / 许可证就绪（gradle 需要时能自动补装 build-tools / NDK）
      - uses: android-actions/setup-android@v3

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # android/ 是生成产物且被 .gitignore 排除，CI 上必须现生成。
      # --no-install：依赖已装过，跳过 npm install（Android 侧不需要 pod install）。
      - name: 生成原生工程
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install

      # release 构建类型在 Expo 模板里就指向 debug keystore。先确认它在，
      # 否则后面会以一个很难看懂的「keystore not found」失败。
      - name: 确认 debug keystore 存在
        run: test -f apps/mobile/android/app/debug.keystore

      # GitHub 分发的安装包必须是完整版：Android 与 iOS 都不带会员购买。
      # 断言的是**生效值**而不是上面那行文本，所以某个 job 自己覆盖成 store
      # （比如从商店版示例里抄了段 env）也会在这里被拦住。
      - name: 断言发行版（GitHub 分发的包必须是完整版）
        run: |
          if [ "$EXPO_PUBLIC_EDITION" != "community" ]; then
            echo "::error::GitHub 分发的安装包必须是 community（完整版），当前是 $EXPO_PUBLIC_EDITION"
            exit 1
          fi
          echo "发行版：$EXPO_PUBLIC_EDITION ✓"

      - name: 构建 release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # 产物校验：光看「构建成功」不够，要确认这个 APK 真的能独立跑起来。
      # 少了内嵌 bundle 的包会「装得上、打开白屏」，而且不会在构建阶段报错。
      - name: 校验产物（可直装 + JS 已内嵌）
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::没找到 $APK"; exit 1; }
          ls -lh "$APK"

          if ! unzip -l "$APK" | grep -q 'assets/index.android.bundle'; then
            echo "::error::APK 里没有 assets/index.android.bundle —— JS 没被打进去，装到手机上会白屏"
            exit 1
          fi
          echo "JS bundle 已内嵌 ✓"

          cp "$APK" "$RUNNER_TEMP/qingjian-music-android.apk"
          ls -lh "$RUNNER_TEMP/qingjian-music-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ runner.temp }}/qingjian-music-android.apk
          if-no-files-found: error
          retention-days: 30

      # 打 tag 时自动挂到 Release，省得去 Actions 页面下载
      - name: 挂到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/qingjian-music-android.apk" \
            --clobber

  # ───────────────────────────────────────────────────────────────────────────
  # 4. iOS 未签名 IPA（供用户自签）
  # ───────────────────────────────────────────────────────────────────────────
  ios:
    name: iOS 未签名 IPA
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 与 android job 同一条约束：GitHub 分发的包必须是完整版，不带会员购买。
      - name: 断言发行版（GitHub 分发的包必须是完整版）
        run: |
          if [ "$EXPO_PUBLIC_EDITION" != "community" ]; then
            echo "::error::GitHub 分发的安装包必须是 community（完整版），当前是 $EXPO_PUBLIC_EDITION"
            exit 1
          fi
          echo "发行版：$EXPO_PUBLIC_EDITION ✓"

      # 与常规 CI / 本地验收共用同一入口：SwiftLint 严格检查、干净 prebuild、
      # Release 设备版无签名编译，以及 bundle / 版本 / 架构 / 平台真实性校验。
      - name: SwiftLint + iOS Release 编译 + 产物校验
        env:
          QJ_IOS_DERIVED_DATA: ${{ runner.temp }}/ios-build
          QJ_IOS_BUILD_LOG: ${{ runner.temp }}/xcodebuild.log
        run: pnpm verify:ios

      # 三条断言都是「不报错但会坑用户」的静默失败：
      #   · 没有 main.jsbundle  → 装得上、打开白屏
      #   · 平台是模拟器版      → 自签工具直接拒绝
      #   · 带了描述文件        → 说明签名没关干净，会和用户自己的签名冲突
      - name: 打包 IPA 并校验
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/ios-build/Build/Products/Release-iphoneos"
          APP=$(find "$PRODUCTS" -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP" || { echo "::error::在 $PRODUCTS 下没找到 .app"; exit 1; }
          echo "产物：$APP"

          test -s "$APP/main.jsbundle" \
            || { echo "::error::缺少有效的 main.jsbundle —— JS 没被打进产物，装到手机上会白屏"; exit 1; }

          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          PLATFORM=$(vtool -show-build "$BIN" | awk '/platform/{print $NF; exit}')
          echo "二进制平台：$PLATFORM"
          test "$PLATFORM" = "IOS" \
            || { echo "::error::期望 iOS 设备版产物，实际是 $PLATFORM（模拟器版无法自签）"; exit 1; }

          test ! -e "$APP/embedded.mobileprovision" \
            || { echo "::error::产物里带了 embedded.mobileprovision，签名没关干净"; exit 1; }

          # IPA 就是一个根目录含 Payload/ 的 zip。用 zip -y 保留符号链接，
          # 不加 --sequesterRsrc（那会产生 __MACOSX，部分自签工具会挑刺）。
          IPA="$RUNNER_TEMP/qingjian-music-unsigned.ipa"
          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry -y "$IPA" Payload)
          unzip -tq "$IPA"
          unzip -l "$IPA" | head -5
          ls -lh "$IPA"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: ${{ runner.temp }}/qingjian-music-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 挂到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/qingjian-music-unsigned.ipa" \
            --clobber
