<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>口袋电台</title><style>*{box-sizing:border-box}body{margin:0;background:#101010;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:430px;margin:auto;padding:26px 16px}.status{font-size:14px;font-weight:600;display:flex;justify-content:space-between;padding:0 14px;margin-bottom:34px}h1{font-size:34px;margin:0 0 22px;letter-spacing:.4px}.group{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;height:148px}.hero{position:relative;overflow:hidden;border:1px solid #ffffff0c;border-radius:20px;background:#1b1b1b;padding:16px}.copy{position:relative;z-index:3}.hero h2{font-size:20px;line-height:1.25;white-space:nowrap;margin:0}.state{font-size:12px;color:#b06b79;margin-top:8px;display:flex;gap:5px;align-items:center}.state:before{content:"";height:4px;width:4px;border-radius:50%;background:currentColor}.record{position:absolute;right:-27px;bottom:-25px;width:112px;height:112px}.disc{width:100%;height:100%;position:relative}.disc img{width:100%;height:100%;display:block}.ring{position:absolute;width:32%;height:32%;left:34%;top:34%;border:1px solid #a44c60;border-radius:50%}.halo{position:absolute;inset:-7px;border:1px solid #ffffff0c;border-radius:50%}.quick{display:flex;flex-direction:column;gap:10px}.tile{flex:1;display:flex;gap:10px;align-items:center;padding:12px;background:#1b1b1b;border:1px solid #ffffff0c;border-radius:16px;font-size:14px;font-weight:600;white-space:nowrap}.tile svg{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.5}.chev{margin-left:auto;font-size:22px;color:#9c9c9c;font-weight:300}.shelf h2{font-size:18px;margin:24px 0 14px}.shelf h2 span{margin-left:8px;color:#808080}.track{display:flex;gap:12px;align-items:center;margin-bottom:16px;height:48px}.cover{width:48px;height:48px;border-radius:5px;flex-shrink:0;background:linear-gradient(145deg,#a47758,#353847 55%,#14252d)}.track:nth-child(3) .cover{background:linear-gradient(145deg,#586d6d,#1a2639 65%,#151a27)}.track:nth-child(4) .cover{background:linear-gradient(145deg,#668376,#2f5245 65%,#10261d)}.title{font-size:16px;font-weight:600}.artist{font-size:13px;color:#969696;margin-top:4px}.more{margin-left:auto;color:#949494;letter-spacing:2px}.playlist{width:130px;height:130px;border-radius:8px;background:linear-gradient(160deg,#7e738d,#c2b2d2 45%,#685582 65%,#2a2538)}.bottom{position:fixed;bottom:0;width:100%;max-width:430px;left:50%;transform:translateX(-50%);background:#101010;padding:0 12px 18px}.mini{height:64px;display:flex;align-items:center;gap:10px;background:#202020;border:1px solid #ffffff0a;border-radius:18px;padding:8px}.mini .cover{width:44px;height:44px}.mini .title{font-size:14px}.mini .controls{margin-left:auto;padding:8px;color:#ddd;font-size:20px}.tabs{display:flex;justify-content:space-around;font-size:11px;color:#777;padding-top:14px}.tabs span:first-child{color:#c66c7e}.engraving{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.engraving text{font-size:7px;letter-spacing:1.5px;fill:#aaa;opacity:.4}.engraving .shadow{fill:#030303;opacity:.8;transform:translateY(-.5px)}@media(prefers-reduced-motion:no-preference){.motion .disc{animation:turn 24s linear infinite}@keyframes turn{to{transform:rotate(360deg)}}}
:root{--bg:#101010;--card:#1b1b1b;--text:#f4f4f4;--muted:#969696;--border:#ffffff0c;--tint:#ad6675}
body.light{--bg:#f2f2f7;--card:#fff;--text:#191919;--muted:#737373;--border:#0000000a;--tint:#945568}
body{background:var(--bg);color:var(--text)}.preview-tools{height:42px;display:flex;align-items:center;justify-content:center;gap:6px;background:#ececee;border-bottom:1px solid #d6d6da;font:11px -apple-system,sans-serif;color:#434348}.preview-tools button{font:inherit;border:0;background:transparent;color:inherit;padding:6px 8px;border-radius:6px;cursor:pointer}.preview-tools button[aria-pressed=true]{background:#fff;color:#171719;box-shadow:0 1px 3px #0001}.preview-tools i{height:14px;width:1px;background:#ccc}.phone{position:relative;max-width:430px;margin:auto;height:calc(100dvh - 42px);min-height:690px;overflow:hidden;background:var(--bg)}main{padding-top:20px}.status{margin-bottom:24px}h1{margin-bottom:20px}.hero,.tile{background:var(--card);border-color:var(--border)}.hero{color:var(--text);cursor:pointer;outline-offset:3px}.hero.active{cursor:default}.state{color:var(--muted);font-weight:400}.active .state{color:var(--tint)}.hero:not(.active) .state:before{display:none}.ring{border-color:var(--tint);opacity:.65}.hole{position:absolute;left:calc(50% - 2px);top:calc(50% - 2px);width:4px;height:4px;border-radius:50%;background:var(--bg)}.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--muted);z-index:5}.active .hint{display:none}.hero .copy{z-index:5}.bottom{position:absolute;background:var(--bg);padding-bottom:18px}.mini{background:var(--card);border-color:var(--border)}.mini .title{color:var(--text)}.artist,.more{color:var(--muted)}.chev{color:var(--muted)}.playlist{height:110px;width:110px}.tabs{color:var(--muted)}.mini .controls{color:var(--text)}.shelf h2{margin-top:24px}.track{margin-bottom:14px}.status{font-variant-numeric:tabular-nums}.hero h2{font-size:20px;letter-spacing:-.4px}.tile{font-size:14px}.halo{border-color:var(--border)}
/* 01: large cropped object; copy remains in a clear top band */
.turntable .hero{background:linear-gradient(135deg,#242426,#161618)}.light .turntable .hero{background:linear-gradient(135deg,#fff,#e7e7eb)}.turntable .machine{position:absolute;width:179px;right:-14px;bottom:-36px;pointer-events:none}.turntable .art-light{position:absolute;width:112px;height:69px;right:26px;bottom:-4px;border-radius:50%;background:linear-gradient(115deg,transparent 30%,#ffffff24 50%,transparent 70%);mix-blend-mode:screen;opacity:0;transform:rotate(-20deg);pointer-events:none}.turntable .hint{display:none}.turntable .hero:not(.active) .state:after{content:" ›"}.turntable .state{margin-top:7px}.turntable .led{position:absolute;right:16px;top:20px;width:4px;height:4px;border-radius:50%;background:#767676}.turntable .active .led{background:var(--tint);box-shadow:0 0 6px #ad66754a}
/* 02: centered radio above bottom-aligned typography */
.radio .hero{background:linear-gradient(145deg,#242323,#1b1a1a)}.light .radio .hero{background:linear-gradient(145deg,#fff,#eeece9)}.radio .machine{position:absolute;width:150px;left:50%;top:-5px;transform:translateX(-50%);z-index:2;pointer-events:none}.radio .copy{position:absolute;left:16px;bottom:15px;right:12px}.radio .copy h2{font-size:18px}.radio .state{margin-top:6px}.radio .hint{display:none}.radio .air{position:absolute;width:90px;height:90px;border:1px solid var(--tint);border-radius:50%;left:22px;top:7px;opacity:0;pointer-events:none}.radio .air.two{left:26px;top:7px}.radio .active .state:after{content:' ';height:3px;width:3px;border-radius:50%;background:var(--tint);margin-left:auto}
/* 03: a graphic path, not a simulated waveform or song progress */
.signal .hero{background:#1a2020}.light .signal .hero{background:#e9efed}.signal .copy{position:absolute;left:16px;bottom:16px}.signal .state{margin-top:7px}.signal .copy h2{font-size:20px}.signal .hint{display:none}.signal .orbit{position:absolute;top:5px;left:5px;width:calc(100% - 10px);height:86px;overflow:visible}.signal .track-path{stroke:#78918b;opacity:.3;stroke-width:1;fill:none}.signal .bead{fill:#aabeb8;opacity:.8;offset-path:path('M 8 48 C 25 2 75 2 89 39 S 153 92 170 40');offset-rotate:0deg}.signal .active .bead{fill:#b57783}.signal .active .track-path{opacity:.65}.signal .state{color:#a0b5ae}.light .signal .state{color:#576f67}
@keyframes glint{0%,100%{opacity:.12;transform:translateX(-7px) rotate(-20deg)}50%{opacity:.55;transform:translateX(7px) rotate(-20deg)}}@keyframes radio-air{0%{transform:scale(.55);opacity:0}30%{opacity:.25}100%{transform:scale(1.12);opacity:0}}
.active .disc{animation:turn 16s linear infinite}.turntable .active .art-light{animation:glint 6s ease-in-out infinite}.radio .active .air{animation:radio-air 3.4s ease-out infinite}.radio .active .air.two{animation-delay:1.7s}.paused *, .hidden *{animation-play-state:paused!important}.hero:not(.active) .bead{offset-distance:10%}.active .bead{animation:travel 11s linear infinite;offset-path:path('M 8 48 C 25 2 75 2 89 39 S 153 92 170 40');offset-rotate:0deg}@keyframes travel{from{offset-distance:0%}to{offset-distance:100%}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}@media(max-width:350px){.tile{padding:9px;gap:7px;font-size:12px}.hero h2{font-size:18px}.hero{padding:14px}.record{width:88px;height:88px;right:-30px;bottom:-22px}.turntable .machine{width:155px;bottom:-26px;right:-16px}.radio .machine{width:145px;top:4px}.radio .copy{left:14px}.signal .copy{left:14px}}
</style></head><body><div class="preview-tools" aria-label="方案预览工具"><button id="mode">查看未开始</button><i></i><button id="pause" aria-pressed="false">暂停动效</button><i></i><button id="theme" aria-pressed="false">浅色</button></div><div class="phone radio"><main><div class="status"><span>9:41</span><span>••• ▰</span></div><h1>首页</h1><div class="group"><div class="hero active"><div class="copy"><h2>随心漫游</h2><div class="state">漫游中</div></div><div class="air"></div><div class="air two"></div><img class="machine" src="assets/radio.png" alt=""><div class="hint">轻点开始 ›</div></div><div class="quick"><div class="tile"><svg viewBox="0 0 24 24"><path d="M12 21S2 15 2 8a5 5 0 0 1 10-1 5 5 0 0 1 10 1c0 7-10 13-10 13Z"/></svg>我喜欢的<span class="chev">›</span></div><div class="tile"><svg viewBox="0 0 24 24"><path d="M12 2v13m-5-5 5 5 5-5M4 11v10h16V11"/></svg>已下载<span class="chev">›</span></div></div></div><section class="shelf"><h2>最近播放<span>›</span></h2><div class="track"><div class="cover"></div><div><div class="title">晨间漫步</div><div class="artist">朝雾实验室</div></div><span class="more">•••</span></div><div class="track"><div class="cover"></div><div><div class="title">静水</div><div class="artist">月白信号</div></div><span class="more">•••</span></div><div class="track"><div class="cover"></div><div><div class="title">雨滴节拍</div><div class="artist">青芽回路</div></div><span class="more">•••</span></div><h2>歌单<span>›</span></h2><div class="playlist"></div></section></main><footer class="bottom"><div class="mini"><div class="cover"></div><div><div class="title">晨间漫步</div><div class="artist">朝雾实验室</div></div><div class="controls">Ⅱ　▸▸</div></div><div class="tabs"><span>首页</span><span>搜索</span><span>音乐库</span><span>设置</span></div></footer></div><script>const hero=document.querySelector('.hero'),state=document.querySelector('.state'),mode=document.querySelector('#mode'),pause=document.querySelector('#pause'),theme=document.querySelector('#theme');function setActive(value){hero.classList.toggle('active',value);state.textContent=value?'漫游中':'未开始';hero.setAttribute('role',value?'group':'button');hero.tabIndex=value?-1:0;hero.setAttribute('aria-label',value?'随心漫游，漫游中':'开始随心漫游');mode.textContent=value?'查看未开始':'查看漫游中';document.querySelector('.controls').textContent=value&&!document.body.classList.contains('paused')?'Ⅱ　▸▸':'▶　▸▸'}mode.onclick=()=>setActive(!hero.classList.contains('active'));hero.onclick=()=>{if(!hero.classList.contains('active'))setActive(true)};hero.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hero.click()}};pause.onclick=()=>{const p=document.body.classList.toggle('paused');pause.textContent=p?'继续动效':'暂停动效';pause.setAttribute('aria-pressed',p);setActive(hero.classList.contains('active'))};theme.onclick=()=>{const l=document.body.classList.toggle('light');theme.textContent=l?'深色':'浅色';theme.setAttribute('aria-pressed',l)};document.addEventListener('visibilitychange',()=>document.body.classList.toggle('hidden',document.hidden));setActive(true);</script></body></html>
