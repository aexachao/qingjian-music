<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>声音轨道</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}body{--bg:#101010;--surface:#1c1c1e;--fg:#f5f5f5;--secondary:#99999f;--line:#ffffff12;--red:#b55c70;background:var(--bg);color:var(--fg)}body.light{--bg:#f2f2f7;--surface:#fff;--fg:#171719;--secondary:#77777e;--line:#0000000c;--red:#ad4e64}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid #bd8190;outline-offset:3px}.lab{height:38px;display:flex;gap:7px;align-items:center;justify-content:center;background:#e9e9ed;color:#55555b;font-size:11px;border-bottom:1px solid #d1d1d7}.lab button{border:1px solid #cccdd2;background:#fafafa;border-radius:6px;padding:4px 9px}.app{max-width:430px;margin:auto;position:relative;min-height:806px;overflow:hidden}.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 29px;font-size:14px;font-weight:650}.island{height:20px;width:86px;background:#000;border-radius:20px}.content{padding:9px 16px 150px}h1{font-size:34px;margin:0 0 18px;letter-spacing:-1px}h2{margin:0;font-size:21px;font-weight:650;letter-spacing:-.5px}.hero{position:relative;overflow:hidden;border-radius:22px;height:176px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;isolation:isolate;transition:background .45s}.hero.active{cursor:default}.hero .statusline{font-size:12px;color:var(--secondary);margin-top:7px;display:flex;align-items:center;gap:5px}.hero .statusline:before{content:'';width:4px;height:4px;border-radius:50%;background:currentColor}.hero.active .statusline{color:var(--red)}.hint{font-size:11px;color:var(--secondary);position:absolute;bottom:17px;left:19px}.active .hint{display:none}.copy{position:relative;z-index:4}.quick{display:flex;gap:10px;margin-top:10px}.quick .tile{height:50px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:0 14px;flex:1;font-size:14px;font-weight:550}.tile .chev{margin-left:auto;font-size:20px;color:var(--secondary)}svg.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.shelf h3{font-size:19px;margin:24px 0 14px;letter-spacing:-.5px}.shelf h3 span{font-size:20px;font-weight:400;color:var(--secondary);margin-left:8px}.track{height:59px;display:flex;gap:12px;align-items:center}.cover{height:44px;width:44px;border-radius:5px;background:linear-gradient(145deg,#e0d9b0,#849578 45%,#23342f);flex-shrink:0;position:relative;overflow:hidden}.cover:after{content:'';position:absolute;width:27px;height:43px;left:17px;top:12px;border-radius:40%;background:#c3d2c449;transform:rotate(-25deg)}.track:nth-child(3) .cover{background:linear-gradient(150deg,#768c9c,#3a424c 50%,#171d30)}.track:nth-child(4) .cover{background:linear-gradient(135deg,#b08964,#414a36)}.song{font-size:15px;font-weight:600}.artist{font-size:12px;color:var(--secondary);margin-top:4px}.more{margin-left:auto;color:var(--secondary);letter-spacing:2px}.playlist{height:85px;border-radius:9px;background:linear-gradient(130deg,#5a526a,#baa9cf 45%,#403553);width:116px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--bg);padding:8px 12px 13px;z-index:10}.mini{height:62px;background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;align-items:center;gap:10px;padding:8px}.mini .cover{width:43px;height:43px}.mini .song{font-size:14px}.transport{margin-left:auto;display:flex;align-items:center;gap:20px;padding-right:7px}.transport button{background:none;border:0;font-size:21px;padding:0;min-height:36px}.tabs{display:flex;justify-content:space-around;padding-top:13px;color:var(--secondary);font-size:10px}.tabs>div{display:flex;align-items:center;flex-direction:column;gap:3px}.tabs>div:first-child{color:var(--red)}.homebar{width:105px;height:4px;border-radius:3px;background:var(--fg);opacity:.8;margin:13px auto 0}.spinner{animation:spin 22s linear infinite;animation-play-state:paused}.active .spinner{animation-play-state:running}.paused .spinner{animation-play-state:paused}.light .hero .equipment{filter:drop-shadow(0 12px 10px #00000020)}@keyframes spin{to{transform:rotate(360deg)}}@keyframes breathe{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
/* baseline */.baseline .group{display:grid;grid-template-columns:1.2fr 1fr;gap:10px}.baseline .hero{height:148px;padding:16px}.baseline .hero h2{font-size:20px}.baseline .quick{flex-direction:column;margin:0}.baseline .tile{padding:0 12px}.disc{position:absolute;width:112px;height:112px;right:-27px;bottom:-25px}.disc img{width:100%;height:100%}.disc:before{content:'';position:absolute;inset:-7px;border:1px solid var(--line);border-radius:50%}.disc:after{content:'';position:absolute;inset:34%;border:1px solid #a44c6088;border-radius:50%}.spindle{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:var(--bg);z-index:2}
/* turntable: asymmetric object */.turntable .hero{height:184px;padding:19px;background:radial-gradient(ellipse at 90% 90%,#3a3634,transparent 75%),#1c1c1e;color:#f5f5f5}.turntable .hero .statusline,.turntable .hero .hint{color:#a69b94}.turntable .hero.active .statusline{color:#c19482}.turntable .equipment{position:absolute;right:-16px;bottom:-24px;width:235px;height:220px;object-fit:contain;z-index:1;transform:rotate(-9deg);transition:transform .7s}.turntable .hero.active .equipment{transform:rotate(-5deg)}.pilot{width:5px;height:5px;border-radius:50%;background:#666;position:absolute;left:20px;bottom:21px}.active .pilot{background:#bd9780;box-shadow:0 0 9px #bd978060;animation:breathe 3s ease-in-out infinite}.turntable .hero.active:after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 45%,#ffffff06 60%,transparent 76%);pointer-events:none}.turntable .hint{left:19px}.paused .pilot{animation-play-state:paused}
/* radio: center object and top rail */.radio .hero{height:191px;background:#ded8cd;color:#322923;padding:17px 19px}.radio .copy{display:flex;justify-content:space-between;align-items:center}.radio .hero h2{font-size:20px}.radio .hero .statusline{margin:0;color:#817669}.radio .hero.active .statusline{color:#915247}.radio .equipment{position:absolute;width:253px;height:155px;object-fit:contain;left:50%;bottom:-2px;transform:translateX(-50%)}.radio .hint{left:0;right:0;text-align:center;bottom:8px;color:#615347;font-size:11px;z-index:3;background:#ded8cde6;width:84px;margin:auto;border-radius:9px;padding:4px}.radio .signal{position:absolute;right:29px;top:65px;display:flex;gap:4px;align-items:center;opacity:0;transition:opacity .5s}.radio .active .signal{opacity:1}.signal i{display:block;width:3px;height:13px;background:#8f554a;border-radius:3px;animation:breathe 1.7s infinite}.signal i:nth-child(2){height:20px;animation-delay:.3s}.signal i:nth-child(3){height:27px;animation-delay:.6s}.paused .signal i{animation-play-state:paused}
/* cassette: graphic media object */.cassette .hero{height:174px;background:#bcc8c3;color:#263b35;padding:12px;border-radius:20px}.tape{position:absolute;inset:10px;border:1px solid #344c3e55;border-radius:12px;box-shadow:inset 0 1px #ffffff70}.tape:before,.tape:after{content:'+';position:absolute;top:5px;font:11px monospace;color:#5c7268}.tape:before{left:8px}.tape:after{right:8px}.cassette .copy{text-align:center;padding-top:13px}.cassette .hero h2{font-size:24px;font-weight:550;letter-spacing:4px}.cassette .statusline{justify-content:center;color:#526c60;font-size:11px;margin-top:5px;letter-spacing:1px}.cassette .hero.active .statusline{color:#354c40}.reels{position:absolute;left:25px;right:25px;height:50px;top:81px;border-radius:28px;background:#283e35;display:flex;justify-content:space-between;align-items:center;padding:6px 17px;box-shadow:inset 0 2px 5px #0008}.reel{width:35px;height:35px;border:8px solid #b4c1b7;border-radius:50%;position:relative;background:#273a33}.reel:before{content:'';position:absolute;inset:-6px;border:2px dashed #526b5b;border-radius:50%}.bridge{height:19px;width:100px;border-radius:5px;background:repeating-linear-gradient(90deg,#586e5d 0 1px,#253c33 1px 6px);opacity:.65}.cassette .hint{left:0;right:0;bottom:11px;text-align:center;color:#456453;font-size:10px}.cassette .active .bridge{background:#537562}.tape-foot{position:absolute;left:32%;right:32%;height:14px;bottom:0;border:1px solid #4b625c44;border-radius:7px 7px 0 0}
/* orbit: full-bleed procedural lines */.orbit .hero{height:166px;background:#222838;color:#eceef5;border:0;display:flex;justify-content:center;align-items:center}.orbit .copy{text-align:center}.orbit .hero h2{font-family:"Songti SC","Noto Serif CJK SC",serif;font-size:28px;font-weight:500;letter-spacing:5px}.orbit .statusline{justify-content:center;color:#a7adbf;letter-spacing:2px;font-size:11px}.orbit .hero.active .statusline{color:#b5bfdc}.orbits{position:absolute;width:320px;height:130px;transform:rotate(-15deg);pointer-events:none}.orbit-line{position:absolute;inset:0;border:1px solid #8295bf22;border-radius:50%}.orbit-line:nth-child(2){inset:18px -34px;transform:rotate(13deg)}.orbit-line:nth-child(3){inset:38px -75px;transform:rotate(26deg)}.orbiter{position:absolute;width:6px;height:6px;left:0;top:0;offset-path:ellipse(145px 48px at 50% 50%);offset-rotate:0deg;animation:journey 25s linear infinite;animation-play-state:paused}@keyframes journey{to{offset-distance:100%}}.orbiter:after{content:'';position:absolute;inset:0;background:#afbddb;border-radius:50%;box-shadow:0 0 20px #afbddb60}.active .orbiter{animation-play-state:running}.paused .orbiter{animation-play-state:paused}.orbit .hint{bottom:15px;left:0;right:0;text-align:center;color:#929db7;font-size:11px}
</style></head><body class="orbit"><div class="lab"><span>预览</span><button id="state">切到漫游中</button><button id="theme">浅色外观</button></div><div class="app"><div class="status"><span>9:41</span><span class="island"></span><span>▰</span></div><main class="content"><h1>首页</h1><div class="group"><div class="hero" role="button" tabindex="0"><div class="copy"><h2>随心漫游</h2><div class="statusline">未开始</div></div><div class="orbits"><div class="orbit-line"></div><div class="orbit-line"></div><div class="orbit-line"></div><div class="orbiter"></div></div><div class="hint">轻点开始 ›</div></div><div class="quick"><div class="tile"><svg class="icon" viewBox="0 0 24 24"><path d="M12 21S2 15 2 8a5 5 0 0 1 10-1 5 5 0 0 1 10 1c0 7-10 13-10 13Z"/></svg>我喜欢的<span class="chev">›</span></div><div class="tile"><svg class="icon" viewBox="0 0 24 24"><path d="M12 2v13m-5-5 5 5 5-5M4 11v10h16V11"/></svg>已下载<span class="chev">›</span></div></div></div><section class="shelf"><h3>最近播放<span>›</span></h3><div class="track"><div class="cover"></div><div><div class="song">晨间漫步</div><div class="artist">朝雾实验室</div></div><span class="more">•••</span></div><div class="track"><div class="cover"></div><div><div class="song">静水</div><div class="artist">月白信号</div></div><span class="more">•••</span></div><div class="track"><div class="cover"></div><div><div class="song">雨滴节拍</div><div class="artist">青芽回路</div></div><span class="more">•••</span></div><h3>歌单<span>›</span></h3><div class="playlist"></div></section></main><footer class="bottom"><div class="mini"><div class="cover"></div><div><div class="song">晨间漫步</div><div class="artist">朝雾实验室</div></div><div class="transport"><button id="pause" aria-label="暂停播放">Ⅱ</button><span>▸▸</span></div></div><nav class="tabs"><div><svg class="icon" viewBox="0 0 24 24"><path d="M3 10 12 3l9 7M5 9v12h5v-7h4v7h5V9"/></svg>首页</div><div><svg class="icon" viewBox="0 0 24 24"><path d="M15 15l6 6M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0"/></svg>搜索</div><div><svg class="icon" viewBox="0 0 24 24"><path d="M5 3v18M10 3v18M15 3l5 18"/></svg>音乐库</div><div><svg class="icon" viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/></svg>设置</div></nav><div class="homebar"></div></footer></div><script>const hero=document.querySelector('.hero'),state=document.querySelector('#state'),theme=document.querySelector('#theme'),pause=document.querySelector('#pause');let active=false,playing=true;function render(){hero.classList.toggle('active',active);hero.setAttribute('aria-label',active?'随心漫游，已开启':'开始随心漫游');hero.setAttribute('role',active?'group':'button');hero.tabIndex=active?-1:0;document.querySelector('.statusline').textContent=active?'漫游已开启':'未开始';state.textContent=active?'切到未开始':'切到漫游中';document.body.classList.toggle('paused',!playing);pause.textContent=playing?'Ⅱ':'▶';pause.setAttribute('aria-label',playing?'暂停播放':'继续播放')}hero.onclick=()=>{if(!active){active=true;render()}};hero.onkeydown=e=>{if(!active&&(e.key==='Enter'||e.key===' ')){e.preventDefault();active=true;render()}};state.onclick=()=>{active=!active;render()};theme.onclick=()=>{document.body.classList.toggle('light');theme.textContent=document.body.classList.contains('light')?'深色外观':'浅色外观'};pause.onclick=()=>{playing=!playing;render()};render();</script></body></html>
